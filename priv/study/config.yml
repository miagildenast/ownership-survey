# Study configuration — the single source of truth for all participant-facing
# copy and every LLM prompt. Edit this file to change the study; it is loaded and
# validated once at application boot (see OwnershipAshChat.Study.Config).
#
# Long-form texts (intro body, task message texts, questionnaire prompts, screen
# bodies) support Markdown and are rendered as HTML in the UI. The `llm.*` prompts
# are NOT Markdown — they are sent to the model verbatim (after {placeholder}
# substitution).
#
# Placeholders replaced at call sites: {topic}, {line1}, {line2}, {original_line},
# {line_no}, {target}, {rejected_line}, {count}, {change}.

title: "Dein, mein, unser? Eine Studie zu kreativem Schreiben, KI und Ideenursprung"

intro:
  heading: "Anleitung für Ihre Schreibaufgabe"
  body: |
    Im Rahmen dieser Studie werden Sie 4 Haikus verfassen. Ein Haiku ist eine kurze japanische Gedichtform, die heute weltweit verbreitet ist. Ein Haiku besteht traditionell aus drei Zeilen mit dem Silbenmuster 5–7–5: Die erste Zeile enthält 5 Silben, die zweite Zeile 7 Silben und die dritte Zeile wieder 5 Silben. 

    Dabei ist nicht die Anzahl der Wörter entscheidend, sondern ausschließlich die Anzahl der Silben. Haikus müssen sich nicht reimen und sind im Präsens (Gegenwart) geschrieben und nehmen häufig Bezug zur Natur oder den Jahreszeiten. 

    Die folgenden Beispiele zeigen deutsche Haikus. Hinter jeder Zeile ist zusätzlich angegeben, aus wie vielen Silben die jeweilige Zeile besteht, um das typische 5–7–5-Muster zu verdeutlichen.

    > Sonnenuntergang. (Son-nen-un-ter-gang -> 5 Silben)  
    > Die leuchtenden Gesichter (Die leuch-ten-den Ge-sich-ter -> 7 Silben)  
    > verblassen wieder. (Ver-blas-sen wie-der -> 5 Silben)

    – [Udo Wenzel](https://www.haiku-heute.de/archiv/haiku-gute-beispiele/)

    > Wolken am Hügel – (Wol-ken am Hü-gel -> 5 Silben)  
    > der Hund des Schäfers treibt sie (der Hund des Schä-fers treibt sie -> 7 Silben)  
    > höher und höher. (Hö-her und hö-her -> 5 Silbend)

    – [Reiner Bonack](https://www.haiku-heute.de/archiv/haiku-gute-beispiele/)

    Klicken Sie auf Start um mit der Aufgabe zu starten.

# Participant-facing guidance in the chat, per condition and 0-based line position.
# An absent (topic_source, ai_mode, position) combination yields no task message.
task_messages:
  - topic_source: assigned
    ai_mode: without_ai
    position: 0
    text: |
      Schreiben Sie zu folgendem Thema ein deutsches Haiku mit der Silbenstruktur 5–7–5: „{topic}“.

      Wenn Sie die dritte Zeile abgeschickt haben, werden Sie automatisch zum Fragebogen geleitet. Dort sehen Sie noch einmal dieses Haiku, füllen Sie den Fragebogen basierend auf diesem Haiku aus.
  - topic_source: free
    ai_mode: without_ai
    position: 0
    text: |
      Schreiben Sie ein deutsches Haiku mit der Silbenstruktur 5–7–5. Sie dürfen dabei das Thema selbst entscheiden und müssen sich nicht an die klassischen Haikuthemen halten. 

      Wenn Sie die dritte Zeile abgeschickt haben, werden Sie automatisch zum Fragebogen geleitet. Dort sehen Sie noch einmal dieses Haiku, füllen Sie den Fragebogen basierend auf diesem Haiku aus.
  # assigned/with_ai is [AI, user, AI]: the AI opens with line 1. This guidance is
  # shown at position 0 — first, above the AI's opening line — to frame the run.
  - topic_source: assigned
    ai_mode: with_ai
    position: 0
    text: |
      Die KI hat Ihnen die erste Zeile zu einem Haiku zum Thema „{topic}“ generiert. Schreiben Sie die zweite Zeile mit 7 Silben. Die KI wird Ihnen danach die dritte Zeile des Haikus generieren (dies kann einen kleinen Moment dauern). 

      Wenn die dritte Zeile generiert wurde, werden Sie automatisch zum Fragebogen geleitet. Dort sehen Sie noch einmal dieses Haiku, füllen Sie den Fragebogen basierend auf diesem Haiku aus.
  - topic_source: free
    ai_mode: with_ai
    position: 0
    text: |
      Schreiben Sie zuerst nur die erste Zeile eines deutschen Haikus mit 5 Silben. Sie dürfen dabei das Thema selbst entscheiden und müssen sich nicht an klassische Haikuthemen halten. Die KI wird ihnen die zweite Zeile generieren (dies kann einen kleinen Moment dauern). Schreiben Sie danach nur die dritte Zeile des Haikus mit 5 Silben. 

      Wenn Sie die dritte Zeile abgeschickt haben, werden Sie automatisch zum Fragebogen geleitet. Dort sehen Sie noch einmal dieses Haiku, füllen Sie den Fragebogen basierend auf diesem Haiku aus.

# 5-7-5 syllable targets, indexed by 0-based line position.
syllable_targets: [5, 7, 5]

llm:
  system_preamble: |
    I am conducting a study on AI, creative writing and Ownership.
    You are a text generation component used in a scientific experiment.
    Your task is to write single lines in haikus.
    Follow the instructions exactly.
    Your FINAL answer must contain only the requested text – no explanations,
    comments, formatting notes, or additional content.
    You may reason internally before producing the final answer; that reasoning
    is not part of the final answer.
    The output language is German unless explicitly stated otherwise.

  # Appended to any base prompt on a retry. Shared by all line + modification retries.
  retry_suffix: |

    Your previous attempt „{rejected_line}“ had {count} syllables, but the line
    must have EXACTLY {target} syllables. Write a DIFFERENT version.

  # Full base prompts per 0-based line position. {target} comes from syllable_targets.
  line_prompts:
    - position: 0
      template: |
        Generate the first line of a German haiku on the topic „{topic}“.

        Constraints:
        - Output exactly one line.
        - Output language: German.
        - Do not add quotation marks.
        - Do not add explanations.
        - Do not add any text before or after the line.
        - The line must contain EXACTLY {target} syllables.
        - NEVER return a line with more or fewer than {target} syllables.
        - Before answering, split every word into syllables and count them.
        - Do not mark syllable boundaries in the output: no hyphens inside words, write every word normally.
        - Return only the first line.
    - position: 1
      template: |
        Generate the second line of a German haiku.

        First line:
        „{line1}“

        Constraints:
        - Output exactly one line.
        - Output language: German.
        - Do not add quotation marks.
        - Do not add explanations.
        - Do not add any text before or after the line.
        - The line must contain EXACTLY {target} syllables.
        - NEVER return a line with more or fewer than {target} syllables.
        - Before answering, split every word into syllables and count them.
        - Do not mark syllable boundaries in the output: no hyphens inside words, write every word normally.
        - Return only the second line.
    - position: 2
      template: |
        Generate the third line of a German haiku.

        First line:
        „{line1}“

        Second line:
        „{line2}“

        Constraints:
        - Output exactly one line.
        - Output language: German.
        - Do not add quotation marks.
        - Do not add explanations.
        - Do not add any text before or after the line.
        - The line must contain EXACTLY {target} syllables.
        - NEVER return a line with more or fewer than {target} syllables.
        - Before answering, split every word into syllables and count them.
        - Do not mark syllable boundaries in the output: no hyphens inside words, write every word normally.
        - Return only the third line.

  modification:
    # {change} is filled from change_descriptions[variant]; {line_no} = line_index + 1.
    base: |
      Here is a German haiku:

      {haiku}

      Modify only line {line_no}: „{original_line}“
      Modification: {change}

      Constraints:
      - Output language: German.
      - Output ONLY the new version of line {line_no} — a single line.
      - Keep the other lines out of your answer.
      - The new line must contain EXACTLY {target} syllables.
      - NEVER return a line with more or fewer than {target} syllables.
      - Before answering, split every word into syllables and count them.
      - Do not mark syllable boundaries in the output: no hyphens inside words, write every word normally.
      - Do not add quotation marks, explanations, or any additional text.
    change_descriptions:
      a: "Change exactly one word in line {line_no}."
      b: "Replace line {line_no} entirely with a new line."

questionnaire:
  # Framing copy shown on the post-run questionnaire, around the haiku (Markdown).
  # `before` renders above the haiku, `after` below it, before the questionnaire
  # items. Set either to "" to omit that part.
  haiku_intro:
    before: "Folgendes Haiku ist im Rahmen der Studie entstanden:"
    after: "Füllen Sie den Fragebogen basierend auf diesem Haiku aus."
  scale:
    min: 1
    max: 5
    labels:
      - value: 1
        label: "Stimme gar nicht zu"
      - value: 2
        label: "Stimme eher nicht zu"
      - value: 3
        label: "Teils/teils"
      - value: 4
        label: "Stimme eher zu"
      - value: 5
        label: "Stimme voll zu"
  items:
    - key: self-identiy
      prompt: "Dieses Haiku spiegelt wieder, wer ich bin."
    - key: self-efficacy
      prompt: "Ich hatte das Gefühl, die Entstehung dieses Haikus erfolgreich beeinflussen zu können."
    - key: autonomy
      prompt: "Ich konnte frei entscheiden, wie dieses Haiku gestaltet wird."
    - key: territoriality
      prompt: "Ich betrachte dieses Haiku als mein Werk."
    - key: accountabilit-and-responsibility
      prompt: "Ich fühle mich für den Inhalt des Haikus verantwortlich."
    - key: liking
      prompt: "Wie sehr magst du dieses Haiku?"
      # Per-item scale-label override. Must cover the full scale (one label per
      # value) or config load fails; see OwnershipAshChat.Study.Config.
      labels:
        - value: 1
          label: "Mag ich überhaupt nicht"
        - value: 2
          label: "Mag ich eher nicht"
        - value: 3
          label: "Teils/Teils"
        - value: 4
          label: "Mag ich"
        - value: 5
          label: "Mag ich sehr"
    - key: authorship
      prompt: "Ich fühle mich als Autor:in dieses Haikus."
  # Shown ONLY on the modification run's questionnaire, after the Likert items.
  open_questions:
    - key: Mitteilungen
      prompt: "Möchten Sie noch etwas zu Ihrer Teilnahme an der Studie mitteilen?"
    - key: Anmerkungen
      prompt: "Haben Sie Anmerkungen oder Feedback zur Studie?"

screens:
  pre_modification:
    heading: "Schreibphase abgeschlossen"
    body: |
      Wenn Sie auf "Weiter" klicken wird Ihnen ein Haiku angezeigt, welches im Rahmen dieser Studie entstanden ist. Bitte lesen Sie es aufmerksam durch. Füllen Sie anschließend den Fragebogen aus.
    # true: skip this transition card, auto-create the modification run and
    # go straight to its Likert (no button click required).
    skip: false
  all_done:
    # mode: copy      -> shows the session ID + copy button (participant enters the
    #                    code into the questionnaire tool themselves).
    # mode: redirect  -> shows a link back to the originating tool. The `redirect`
    #                    block is then required. In `url` and `params[].value` only
    #                    the placeholders %case_id% and %session_id% are allowed.
    mode: redirect
    heading: "Fast geschafft!"
    body: |
      Vielen Dank für Ihre Teilnahme! Bitte klicken Sie auf den Button, um zum Fragebogen-Tool zurückzukehren.
    redirect:
      url: "https://www.sosci.uni-hamburg.de/aiownership/"
      button_label: "Zurück zum Fragebogen"
      params:
        - key: i
          value: "%case_id%"
        - key: return
          value: "1"
